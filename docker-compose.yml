services:
  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskflow_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - taskflow_net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - taskflow_net

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: taskflow-jenkins
    user: root
    restart: unless-stopped
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JENKINS_OPTS: '--httpPort=8080'
    networks:
      - taskflow_net

volumes:
  mongo_data:
  jenkins_home:

networks:
  taskflow_net:
    driver: bridge